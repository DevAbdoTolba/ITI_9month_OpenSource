{% extends 'udempy/base.html' %}
{% block title %}Teachers{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Teachers</h3>
  <a href="{% url 'teacher_create' %}" class="btn btn-primary btn-sm">+ Add Teacher</a>
</div>

<form method="get" class="row g-2 mb-3">
  <div class="col-auto">
    <input type="text" name="q" value="{{ q|default:'' }}" class="form-control form-control-sm" placeholder="Search name...">
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-secondary btn-sm">Search</button>
  </div>
</form>

<div class="card shadow-sm">
  <table class="table table-hover mb-0">
    <thead class="table-light">
      <tr><th>Name</th><th>Age</th><th>Salary</th><th class="text-end">Actions</th></tr>
    </thead>
    <tbody>
    {% for teacher in teachers %}
      <tr>
        <td>{{ teacher.name }}</td>
        <td>{{ teacher.age }}</td>
        <td>{{ teacher.salary }}</td>
        <td class="text-end">
          <a href="{% url 'teacher_update' teacher.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
          <a href="{% url 'teacher_delete' teacher.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="4" class="text-center text-muted py-4">No teachers found.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
