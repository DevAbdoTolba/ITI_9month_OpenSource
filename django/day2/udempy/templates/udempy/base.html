<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Udempy{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f7f7f9; }
    .navbar-brand { font-weight:600; letter-spacing:.3px; }
    .table td { vertical-align:middle; }
    .thumb { width:48px; height:48px; object-fit:cover; border-radius:6px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'index' %}">Udempy</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'student_list' %}">Students</a>
        <a class="nav-link" href="{% url 'course_list' %}">Courses</a>
        <a class="nav-link" href="{% url 'teacher_list' %}">Teachers</a>
        <a class="nav-link" href="{% url 'enrollment_list' %}">Enrollments</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
