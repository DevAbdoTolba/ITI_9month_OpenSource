{% extends 'udempy/base.html' %}
{% block title %}Home · Udempy{% endblock %}

{% block content %}
<h3 class="mb-1">School Management</h3>
<p class="text-muted mb-4">Pick a section to manage.</p>

<div class="row g-3">
  <div class="col-sm-6 col-lg-3">
    <a href="{% url 'student_list' %}" class="text-decoration-none text-dark">
      <div class="card shadow-sm h-100"><div class="card-body"><h5 class="card-title mb-0">Students</h5></div></div>
    </a>
  </div>
  <div class="col-sm-6 col-lg-3">
    <a href="{% url 'course_list' %}" class="text-decoration-none text-dark">
      <div class="card shadow-sm h-100"><div class="card-body"><h5 class="card-title mb-0">Courses</h5></div></div>
    </a>
  </div>
  <div class="col-sm-6 col-lg-3">
    <a href="{% url 'teacher_list' %}" class="text-decoration-none text-dark">
      <div class="card shadow-sm h-100"><div class="card-body"><h5 class="card-title mb-0">Teachers</h5></div></div>
    </a>
  </div>
  <div class="col-sm-6 col-lg-3">
    <a href="{% url 'enrollment_list' %}" class="text-decoration-none text-dark">
      <div class="card shadow-sm h-100"><div class="card-body"><h5 class="card-title mb-0">Enrollments</h5></div></div>
    </a>
  </div>
</div>
{% endblock %}
